[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

# NODE_ENV=production skips devDependencies, but Vite/esbuild need them to build
[build.environment]
  NPM_CONFIG_PRODUCTION = "false"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/**"]

[functions.api]
  timeout = 26

# API routes → Express serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# User uploads are served by Express, not static files
[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback — Netlify serves existing static files first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
